<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Métricas - Avistamiento de Aves</title>
        <link rel="stylesheet" href="../css/styles.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            .graficos-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
                gap: 25px;
                margin-top: 20px;
            }
            .grafico-card {
                background: #ffffff;
                border: 1px solid #e0e0e0;
                border-radius: 8px;
                padding: 20px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            }
            .grafico-card h3 {
                margin-top: 0;
                color: #2c3e50;
                font-size: 1.1rem;
                text-align: center;
                margin-bottom: 15px;
            }
        </style>
    </head>

    <body>
        <header>
            <h1>Unión de Ornitólogos de Chile</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="login.html">Registro / Login</a></li>
                    <li><a href="avistamiento.html">Informar Avistamiento</a></li>
                    <li><a href="dashboard.html">Métricas</a></li>
                </ul>
            </nav>
        </header>

        <main style="padding: 20px;">
            <h2>Dashboard de Métricas</h2>
            <p>Visualización del registro de voluntarios y avistamientos.</p>

            <div class="graficos-grid">
                <div class="grafico-card">
                    <h3>Voluntarios Registrados por Región</h3>
                    <canvas id="chart-voluntarios-region"></canvas>
                </div>

                <div class="grafico-card">
                    <h3>Avistamientos Registrados</h3>
                    <canvas id="chart-avistamientos-registrados"></canvas>
                </div>
            </div>
        </main>

        <script src="../js/dashboard.js"></script>
    </body>
</html>
